name: CI

on:
  push:
  pull_request:
    branches:
      - v1.x

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: VS2022 x86 Development
            os: windows-2025
            compiler: VS2022
            toolset: v143
            platform: x86
            configuration: Development
          - name: VS2022 x86 Release
            os: windows-2025
            compiler: VS2022
            toolset: v143
            platform: x86
            configuration: Release
          - name: VS2022 x64 Development
            os: windows-2025
            compiler: VS2022
            toolset: v143
            platform: x64
            configuration: Development
          - name: VS2022 x64 Release
            os: windows-2025
            compiler: VS2022
            toolset: v143
            platform: x64
            configuration: Release
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 5

    - name: Install VSSetup
      run: Install-Module VSSetup -Scope CurrentUser
      shell: powershell

    - name: Show installed toolsets
      run: |
        echo "--- All:"
        Get-VSSetupInstance -All
        echo "--- VC140:"
        Get-VSSetupInstance -All | Select-VSSetupInstance -Latest -Require Microsoft.VisualStudio.Component.VC.140
      shell: powershell

    - if: matrix.toolset == 'v140'
      name: Install missing Visual Studio components
      run: python .github/workflows/install-vs-components.py

    - if: matrix.toolset == 'v140'
      name: Show installed toolsets
      run: |
        echo "--- All:"
        Get-VSSetupInstance -All
        echo "--- VC140:"
        Get-VSSetupInstance -All | Select-VSSetupInstance -Latest -Require Microsoft.VisualStudio.Component.VC.140
      shell: powershell

    - name: Download optional 3rdparty extras
      run: |
        curl https://renderdoc.org/qrenderdoc_3rdparty.zip -O
        7z x qrenderdoc_3rdparty.zip
    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v2
    - name: Building solution
      run: msbuild.exe renderdoc.sln -p:UseMultiToolTask=true "/p:Configuration=${{ matrix.configuration }}" "/p:Platform=${{ matrix.platform }}" "/p:PlatformToolset=${{ matrix.toolset }}"
      shell: powershell
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: |
          */${{ matrix.configuration }}/*
          !*/${{ matrix.configuration }}/obj*
          !*/${{ matrix.configuration }}/pymodules*
          !*/${{ matrix.configuration }}/*.ilk
          !*/${{ matrix.configuration }}/*.exp
          !*/${{ matrix.configuration }}/*.lib
          !*/${{ matrix.configuration }}/driver*.pdb
    - if: matrix.configuration == 'Development'
      name: Running core unit tests
      run: |
        if ! ./*/Development/renderdoccmd.exe test unit -o test.log; then
          echo "::error::$(cat test.log)" | tr -d '\r' |  tr '\n' '\001' | sed -e 's#\x01#%0D%0A#g';
          exit 1;
        fi
    - if: matrix.configuration == 'Development'
      name: Running UI unit tests
      run: |
        if ! ./*/Development/qrenderdoc.exe --unittest log=test.log; then
          echo "::error::$(cat test.log)" | tr -d '\r' |  tr '\n' '\001' | sed -e 's#\x01#%0D%0A#g';
          exit 1;
        fi
